name: Tests and Coverage

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: securecode_test
          POSTGRES_PASSWORD: securecode_test_password
          POSTGRES_DB: securecode_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql+psycopg2://securecode_test:securecode_test_password@localhost:5432/securecode_test
      JWT_SECRET_KEY: test-secret-key-that-is-at-least-32-bytes-long

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov
          pip install -e .
          
      - name: Run tests with coverage
        run: |
          python -m pytest --cov=src --cov-report=term-missing --cov-report=xml tests/ -v
