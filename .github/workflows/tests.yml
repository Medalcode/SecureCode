name: Tests and Coverage

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-24.04

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: securecode_test
          POSTGRES_PASSWORD: securecode_test_password
          POSTGRES_DB: securecode_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      APP_ENV: test
      DATABASE_URL: postgresql+psycopg2://securecode_test:securecode_test_password@localhost:5432/securecode_test
      JWT_SECRET_KEY: test-secret-key-that-is-at-least-32-bytes-long

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install PostgreSQL 15 client tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ca-certificates curl gnupg
          sudo install -d -m 0755 /etc/apt/keyrings
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo gpg --batch --yes --dearmor -o /etc/apt/keyrings/postgresql.gpg
          echo "deb [signed-by=/etc/apt/keyrings/postgresql.gpg] https://apt.postgresql.org/pub/repos/apt noble-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list > /dev/null
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends postgresql-client-15
          /usr/lib/postgresql/15/bin/pg_dump --version
          /usr/lib/postgresql/15/bin/pg_restore --version
          echo "/usr/lib/postgresql/15/bin" >> "$GITHUB_PATH"
          echo "PG_BIN_DIR=/usr/lib/postgresql/15/bin" >> "$GITHUB_ENV"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"

      - name: Verify PostgreSQL client/server compatibility
        run: |
          pg_dump --version
          pg_restore --version
          psql "postgresql://securecode_test:securecode_test_password@localhost:5432/securecode_test" -c "SHOW server_version;"

      - name: Run tests with coverage
        run: |
          python -m mypy src/
          python -m pytest --cov=src --cov-fail-under=85 --cov-report=term-missing --cov-report=xml tests/ -v
