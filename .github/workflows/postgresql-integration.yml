name: PostgreSQL Integration

on:
  workflow_dispatch:

jobs:
  validate-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: securecode_test
          POSTGRES_PASSWORD: securecode_test_password
          POSTGRES_DB: securecode_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql+psycopg2://securecode_test:securecode_test_password@localhost:5432/securecode_test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest
          
      - name: Run PostgreSQL Integration Tests & Generate Artifact
        run: python scripts/run_postgres_validation.py

      - name: Run Traceability Demo (PostgreSQL)
        run: python scripts/traceability_demo.py

      - name: Upload PostgreSQL Validation Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: securecode-postgresql-validation
          path: artifacts/postgresql_validation.json
