apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: securecode-staging
  annotations:
    run.googleapis.com/ingress: all
    run.googleapis.com/execution-environment: gen2
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: "0"
        autoscaling.knative.dev/maxScale: "2"
        run.googleapis.com/cpu-throttling: "true"
        run.googleapis.com/startup-cpu-boost: "false"
        run.googleapis.com/service-account: REPLACE_WITH_STAGING_SA
    spec:
      serviceAccountName: REPLACE_WITH_STAGING_SA
      containerConcurrency: 40
      timeoutSeconds: 60
      containers:
        - name: securecode
          image: REPLACE_REGION-docker.pkg.dev/REPLACE_PROJECT_ID/securecode/securecode:REPLACE_DIGEST
          ports:
            - name: http1
              containerPort: 8080
          env:
            - name: APP_ENV
              value: staging
            - name: PORT
              value: "8080"
            - name: LOG_LEVEL
              value: INFO
            - name: JWT_ALGORITHM
              value: HS256
            - name: JWT_ACCESS_TOKEN_EXPIRE_MINUTES
              value: "60"
            - name: CORS_ORIGINS
              value: https://staging.example.invalid
            - name: LOGIN_MAX_FAILURES
              value: "5"
            - name: LOGIN_WINDOW_SECONDS
              value: "900"
            - name: TRUST_PROXY_HEADERS
              value: "true"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: securecode-staging-database-url
                  key: url
            - name: JWT_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: securecode-staging-jwt-secret
                  key: secret
            - name: GITHUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: securecode-staging-github-token
                  key: token
          resources:
            limits:
              cpu: "1"
              memory: 512Mi
          startupProbe:
            httpGet:
              path: /health/live
              port: http1
            initialDelaySeconds: 2
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /health/live
              port: http1
            periodSeconds: 30
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http1
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
